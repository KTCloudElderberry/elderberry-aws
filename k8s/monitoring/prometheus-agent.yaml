# AWS 지표를 kt cloud Prometheus로 보내는 Agent (노드마다 1개)
# 채원님 알림 규칙: absent_over_time(up{env="aws"}[1m]) → env="aws" 라벨 필수
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agent-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        env: aws
        node: ${NODE_NAME}   # v3: 환경변수를 자동으로 치환

    scrape_configs:
      # Agent 자기 자신 → up{env="aws"} 생성 (AWSMetricsMissing 판단 기준)
      - job_name: aws-agent
        static_configs:
          - targets: ["localhost:9090"]

    # kt cloud Prometheus (채원님, Tailscale 경유)
    remote_write:
      - url: http://100.96.199.122:9090/api/v1/write
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prometheus-agent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: prometheus-agent
  template:
    metadata:
      labels:
        app: prometheus-agent
    spec:
      automountServiceAccountToken: false   # 쿠버네티스 API를 쓰지 않음
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.5      # LTS (2027-07까지 지원)
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/prometheus
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-agent-config
        - name: data
          emptyDir: {}   # 전송 대기 데이터(WAL). 파드가 재시작되면 비워짐
