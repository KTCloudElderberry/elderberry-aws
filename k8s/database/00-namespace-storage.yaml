# DB 전용 네임스페이스
# 이름은 Terraform cnpg.tf의 cnpg_namespace와 같아야 해요 (Pod Identity 연결 대상)
apiVersion: v1
kind: Namespace
metadata:
  name: database
---
# DB 디스크 규칙: 암호화된 gp3 EBS
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
provisioner: ebs.csi.aws.com          # 오늘 설치한 EBS CSI 드라이버가 처리
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete                 # PVC를 지우면 EBS도 같이 지움 (매일 destroy 구조)
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true